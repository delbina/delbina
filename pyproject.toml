[project]
name = "delbina"
version = "0.0.1"
description = "Context-compression layer to cut chat token re-read cost"
requires-python = ">=3.10"
dependencies = ["tiktoken"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]