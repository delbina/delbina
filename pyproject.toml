[project]
name = "delbina"
dynamic = ["version"]
description = "Cut the token bill of long LLM chats and AI agents: cache-friendly context compression, tool-output trimming, and a drop-in OpenAI-compatible proxy"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Krupakar S Bilichod" }]
requires-python = ">=3.10"
dependencies = ["tiktoken>=0.7"]
keywords = ["llm", "tokens", "context", "compression", "chat", "agents", "prompt-caching", "proxy", "summarization", "ollama", "openai", "anthropic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
hf = ["tokenizers>=0.15"]
dev = ["pytest", "build", "twine"]

[project.scripts]
delbina = "delbina.cli:main"

[project.urls]
Homepage = "https://github.com/delbina/delbina"
Documentation = "https://github.com/delbina/delbina/tree/main/docs"
Issues = "https://github.com/delbina/delbina/issues"
Changelog = "https://github.com/delbina/delbina/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "delbina.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
delbina = ["py.typed"]
